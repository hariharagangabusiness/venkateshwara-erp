# nginx reverse-proxy vhost for the ERP on a self-managed VM. Copy to
# /etc/nginx/sites-available/erp, replace YOUR_DOMAIN, symlink into
# sites-enabled, then run `sudo certbot --nginx -d YOUR_DOMAIN` - certbot
# rewrites this file in place to add the 443/TLS server block, so this
# file only needs to define the plain HTTP proxy and its cert-challenge path.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Uploaded files can be large PDFs/scanned copies of Bank Guarantees etc.
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
