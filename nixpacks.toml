# Railway builds this app with Nixpacks by default, which produces a bare
# Node.js container with none of the shared libraries a real Chromium binary
# needs at runtime (libnss3.so, libatk, libcups, etc). Without this file,
# every PDF export (offers, invoices, POs, challans, service reports) fails
# in production with "error while loading shared libraries: libnss3.so:
# cannot open shared object file" - @sparticuz/chromium's bundled binary
# still depends on those system libraries being present on the host; it
# isn't a fully static build.
#
# A first attempt at this fix used `nixPkgs = ["chromium"]` alone, on the
# theory that lib/browserPath.js's findOnPath() would find it on PATH via
# `which` and use that real browser instead of ever touching the
# @sparticuz/chromium fallback. In production the failure persisted
# completely unchanged (still crashing inside @sparticuz/chromium's own
# extracted /tmp/chromium binary), proving findOnPath() never actually
# located the Nix-installed chromium - Nix packages live under isolated
# /nix/store/<hash>-... paths, and whether that lands somewhere `which` can
# see depends on shell/profile setup this Nixpacks image doesn't guarantee.
#
# aptPkgs sidesteps that discovery problem entirely: these install as
# regular Debian packages into the standard system library path
# (/usr/lib/x86_64-linux-gnu/...), which is exactly where the dynamic linker
# for @sparticuz/chromium's EXISTING bundled binary already looks - no PATH
# detection, no `which`, no Nix wrapping quirks required. This is the
# package list from ryannono/Puppeteer-Railway-Buildpack, a buildpack
# purpose-built for running Puppeteer on Railway's Nixpacks builder.
[phases.setup]
aptPkgs = [
  "fonts-liberation",
  "libappindicator3-1",
  "libasound2",
  "libatk-bridge2.0-0",
  "libatk1.0-0",
  "libgbm1",
  "libgtk-3-0",
  "libnspr4",
  "libnss3",
  "libx11-xcb1",
  "libxcomposite1",
  "libxcursor1",
  "libxdamage1",
  "libxfixes3",
  "libxi6",
  "libxrandr2",
  "libxss1",
  "libxtst6",
  "xdg-utils"
]
