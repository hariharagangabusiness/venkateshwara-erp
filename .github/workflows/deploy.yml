name: Deploy to production

# Fires on every push to main (i.e. every time a PR is merged) - this is
# the piece that was missing: nothing in this repo previously triggered a
# deploy, so the live server kept serving whatever was on it from the last
# time someone manually pulled, however long ago that was.
on:
  push:
    branches: [main]
  # Lets you trigger a deploy by hand from the Actions tab without a new
  # commit - useful for the first run, or to re-deploy after fixing a
  # secret without needing a throwaway commit.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and run deploy.sh on the server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Defaults to 22 if the DEPLOY_PORT secret is never set - only add
          # that secret if sshd runs on a non-standard port.
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: bash ${{ secrets.DEPLOY_PATH }}/deploy.sh
