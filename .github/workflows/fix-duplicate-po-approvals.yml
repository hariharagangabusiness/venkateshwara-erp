name: Fix duplicate PO approvals (PR #255 cleanup)

# One-off, manually-triggered run of scripts/fix-duplicate-po-approvals.js
# against the production database, over the same SSH path deploy.yml /
# run-grn-consolidation.yml already use (same DEPLOY_HOST/DEPLOY_USER/
# DEPLOY_SSH_KEY/DEPLOY_PORT/DEPLOY_PATH secrets - no new credentials
# needed). Cleans up the orphaned duplicate Pending approvals left behind
# by the bug fixed in PR #255 (resubmitPoGroup() only superseding the one
# approval_id it was handed, instead of every live approval for the po_no
# group) - e.g. PO-1793773966158 showing up 3 times in My Approvals.
#
# Defaults to a dry run (mode=dry-run) so the output can be reviewed in
# the Action log before anyone runs mode=apply, which actually writes to
# erp.db.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (default, writes nothing) or apply (writes to the real database)'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and run the cleanup script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            MODE="${{ inputs.mode }}"

            DATA_DIR=$(sudo -u erp sh -c "cat '$APP_DIR/.env' 2>/dev/null | sed -n 's/^DATA_DIR=//p'" | tail -1)
            if [ -z "$DATA_DIR" ]; then DATA_DIR="$APP_DIR/db"; fi
            DB_PATH="$DATA_DIR/erp.db"
            echo "==> Using database: $DB_PATH"
            if [ ! -f "$DB_PATH" ]; then
              echo "erp.db not found at $DB_PATH - aborting." >&2
              exit 1
            fi
            if [ "$MODE" = "apply" ]; then
              BACKUP="$DATA_DIR/erp.db.pre-dup-po-approval-fix.$(date +%Y%m%d%H%M%S).bak"
              echo "==> Backing up to $BACKUP"
              sudo -u erp cp "$DB_PATH" "$BACKUP"
              echo "==> Running with --apply"
              sudo -u erp node "$APP_DIR/scripts/fix-duplicate-po-approvals.js" "$DB_PATH" --apply
            else
              echo "==> Running dry run (no changes)"
              sudo -u erp node "$APP_DIR/scripts/fix-duplicate-po-approvals.js" "$DB_PATH"
            fi
