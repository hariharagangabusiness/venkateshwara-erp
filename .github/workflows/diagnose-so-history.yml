name: Diagnose Sales Order history

# One-off, manually-triggered, READ-ONLY run of scripts/diagnose-so-history.js
# against the production database, over the same SSH path deploy.yml /
# diagnose-proforma-client.yml / diagnose-so-delete.yml already use (same
# DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY/DEPLOY_PORT/DEPLOY_PATH secrets - no
# new credentials needed). Never writes to erp.db.
on:
  workflow_dispatch:
    inputs:
      order_no:
        description: 'The order_no to diagnose (e.g. SO-1794480223491)'
        required: true
        type: string

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and run the read-only diagnostic
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            ORDER_NO="${{ inputs.order_no }}"

            DATA_DIR=$(sudo -u erp sh -c "cat '$APP_DIR/.env' 2>/dev/null | sed -n 's/^DATA_DIR=//p'" | tail -1)
            if [ -z "$DATA_DIR" ]; then DATA_DIR="$APP_DIR/db"; fi
            DB_PATH="$DATA_DIR/erp.db"
            echo "==> Using database: $DB_PATH"
            if [ ! -f "$DB_PATH" ]; then
              echo "erp.db not found at $DB_PATH - aborting." >&2
              exit 1
            fi
            sudo -u erp node "$APP_DIR/scripts/diagnose-so-history.js" "$DB_PATH" "$ORDER_NO"
