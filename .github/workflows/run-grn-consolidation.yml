name: Run historical GRN consolidation

# One-off, manually-triggered run of scripts/consolidate-historical-grn.js
# against the production database, over the same SSH path deploy.yml
# already uses (same DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY/DEPLOY_PORT/
# DEPLOY_PATH secrets - no new credentials needed).
#
# Defaults to a dry run (mode=dry-run) so the output can be reviewed in
# the Action log before anyone runs mode=apply, which actually writes to
# erp.db. mode=find-db is a pure diagnostic (no sudo beyond the sudo -u
# erp pattern deploy.sh already proves works) that just locates erp.db -
# use it first if dry-run/apply ever can't find the database, rather than
# guessing again at broader sudo rights the deploy user may not have.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (default, writes nothing), apply (writes to the real database), or find-db (diagnostic only)'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply
          - find-db

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and run the consolidation script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            MODE="${{ inputs.mode }}"

            if [ "$MODE" = "find-db" ]; then
              echo "==> whoami / sudo -u erp whoami"
              whoami
              sudo -u erp whoami
              echo "==> Looking for a .env file under $APP_DIR"
              sudo -u erp sh -c "cat '$APP_DIR/.env' 2>/dev/null | grep -i DATA_DIR" || echo "(no DATA_DIR line found in $APP_DIR/.env, or no .env there)"
              echo "==> Searching for erp.db under $APP_DIR (depth 4)"
              sudo -u erp find "$APP_DIR" -maxdepth 4 -iname 'erp.db' 2>&1 || true
              echo "==> Searching more broadly for erp.db (depth 6 from /, may take a moment)"
              sudo -u erp find / -maxdepth 6 -iname 'erp.db' 2>/dev/null || true
              exit 0
            fi

            # Discover DATA_DIR from a .env file in the app dir (the
            # EnvironmentFile= a systemd service like this one typically
            # points at) - read via sudo -u erp, the only sudo pattern
            # deploy.sh already proves this account can use; sudo
            # systemctl show/cat on arbitrary paths is NOT assumed to work.
            DATA_DIR=$(sudo -u erp sh -c "cat '$APP_DIR/.env' 2>/dev/null | sed -n 's/^DATA_DIR=//p'" | tail -1)
            if [ -z "$DATA_DIR" ]; then DATA_DIR="$APP_DIR/db"; fi
            DB_PATH="$DATA_DIR/erp.db"
            echo "==> Using database: $DB_PATH"
            if [ ! -f "$DB_PATH" ]; then
              echo "erp.db not found at $DB_PATH - aborting. Re-run this workflow with mode=find-db to locate it." >&2
              exit 1
            fi
            if [ "$MODE" = "apply" ]; then
              BACKUP="$DATA_DIR/erp.db.pre-grn-consolidation.$(date +%Y%m%d%H%M%S).bak"
              echo "==> Backing up to $BACKUP"
              sudo -u erp cp "$DB_PATH" "$BACKUP"
              echo "==> Running with --apply"
              sudo -u erp node "$APP_DIR/scripts/consolidate-historical-grn.js" "$DB_PATH" --apply
            else
              echo "==> Running dry run (no changes)"
              sudo -u erp node "$APP_DIR/scripts/consolidate-historical-grn.js" "$DB_PATH"
            fi
