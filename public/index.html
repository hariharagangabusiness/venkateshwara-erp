<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venkateshwara Engineers - ERP</title>
<style>
  :root{
    --primary:#1e3a5f; --primary-light:#2c5282; --accent:#c9822a; --bg:#f4f6f8;
    --card:#ffffff; --border:#dde3e8; --text:#1a202c; --muted:#6b7686;
    --green:#2f855a; --red:#c53030; --amber:#b7791f;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #login-screen{display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,var(--primary),var(--primary-light));}
  .login-box{background:var(--card);padding:36px 40px;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.25);width:340px;}
  .login-box h1{font-size:18px;margin:0 0 4px;color:var(--primary);}
  .login-box p{font-size:12px;color:var(--muted);margin:0 0 20px;}
  .login-box input{width:100%;padding:10px 12px;margin-bottom:12px;border:1px solid var(--border);border-radius:6px;font-size:14px;}
  .login-box button{width:100%;padding:10px;background:var(--primary);color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer;font-weight:600;}
  .login-box button:hover{background:var(--primary-light);}
  .login-err{color:var(--red);font-size:12px;margin-top:8px;min-height:14px;}
  .hint{font-size:11px;color:var(--muted);margin-top:16px;line-height:1.5;border-top:1px solid var(--border);padding-top:12px;}

  #app{display:none;height:100vh;}
  .shell{display:flex;height:100vh;}
  .sidebar{width:230px;background:var(--primary);color:#fff;flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto;}
  .sidebar .brand{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.15);}
  .sidebar .brand strong{font-size:14px;display:block;}
  .sidebar .brand span{font-size:11px;opacity:.7;}
  .nav-group{padding:8px 0;}
  .nav-group h4{font-size:10px;text-transform:uppercase;letter-spacing:.05em;opacity:.55;padding:8px 16px 4px;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;}
  .nav-group h4:hover{opacity:.85;}
  .nav-group h4 .chev{font-size:9px;transition:transform .15s ease;opacity:.8;}
  .nav-group.collapsed h4 .chev{transform:rotate(-90deg);}
  .nav-group.collapsed .nav-items{display:none;}
  .nav-item{display:block;padding:9px 16px;font-size:13px;color:#e2e8f0;text-decoration:none;cursor:pointer;border-left:3px solid transparent;}
  .nav-item:hover{background:rgba(255,255,255,.08);}
  .nav-item.active{background:rgba(255,255,255,.14);border-left-color:var(--accent);font-weight:600;}
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .topbar{background:#fff;border-bottom:1px solid var(--border);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;}
  .topbar h2{margin:0;font-size:17px;}
  .userinfo{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:12px;}
  .userinfo b{color:var(--text);}
  .logout-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--muted);}
  .logout-btn:hover{border-color:var(--red);color:var(--red);}
  .content{flex:1;overflow-y:auto;padding:24px;}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:24px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;cursor:pointer;transition:box-shadow .15s,transform .15s,border-color .15s;}
  .card:hover{box-shadow:0 3px 12px rgba(0,0,0,.10);transform:translateY(-1px);border-color:var(--primary);}
  .card.active{border-color:var(--primary);box-shadow:0 0 0 2px rgba(21,101,192,.15) inset;}
  .card .num{font-size:26px;font-weight:700;color:var(--primary);}
  .card .label{font-size:12px;color:var(--muted);margin-top:2px;}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px;margin-bottom:20px;}
  .panel h3{margin:0 0 14px;font-size:14px;color:var(--primary);border-bottom:1px solid var(--border);padding-bottom:8px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;background:#f7f9fb;padding:8px 10px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:8px 10px;border-bottom:1px solid #edf1f4;}
  tr:hover td{background:#fafbfc;}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;}
  .mono{font-family:'Courier New',monospace;}
  .badge.Pending{background:#fef3cd;color:var(--amber);}
  .badge.Approved,.badge.Completed,.badge.Paid,.badge.Won,.badge.active{background:#dcf3e6;color:var(--green);}
  .badge.Rejected,.badge.Lost{background:#fde2e2;color:var(--red);}
  .badge.InProgress,.badge.Draft,.badge.OrderPlaced,.badge.Open{background:#dbeafe;color:#1d4ed8;}
  .badge.OnHold{background:#eee;color:#666;}

  .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:12px;}
  .form-grid label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;}
  .form-grid input,.form-grid select,.form-grid textarea{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:5px;font-size:13px;font-family:inherit;}
  .btn{background:var(--primary);color:#fff;border:none;border-radius:6px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:600;}
  .btn:hover{background:var(--primary-light);}
  .btn.small{padding:4px 10px;font-size:11px;}
  .btn.green{background:var(--green);} .btn.green:hover{background:#276749;}
  .btn.red{background:var(--red);} .btn.red:hover{background:#9b2c2c;}
  .btn.outline{background:#fff;color:var(--primary);border:1px solid var(--primary);}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .msg{font-size:12px;padding:8px 10px;border-radius:5px;margin-bottom:10px;}
  .msg.ok{background:#dcf3e6;color:var(--green);} .msg.err{background:#fde2e2;color:var(--red);}
  .muted{color:var(--muted);font-size:12px;}
  .tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--border);}
  .tab{padding:8px 14px;font-size:13px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;}
  .tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600;}
  .empty{color:var(--muted);font-size:13px;padding:20px;text-align:center;}
  .comments-list{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;margin-bottom:10px;}
  .comment{background:var(--bg,#f7f8fa);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;}
  .comment b{font-size:12px;}
  .hod-tools{border-top:1px dashed var(--border);margin-top:16px;padding-top:14px;}
  .hod-tools h4{margin:0 0 10px;font-size:13px;color:var(--primary);}
  .hod-tools .sub-section{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border);}
  .hod-tools .sub-section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .attachments-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
  .attachments-list a{font-size:13px;}
  .access-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
  .access-group-title{font-size:12px;font-weight:600;color:var(--primary);margin-bottom:6px;}
  .access-item{display:block;font-size:13px;padding:3px 0;color:var(--text,#333);}
  .access-item input{margin-right:6px;}
  .inline-edit{border-bottom:1px dashed var(--border);cursor:text;}
  .inline-edit:focus{outline:1px solid var(--primary);background:#fff;}
  tfoot td{font-weight:600;background:var(--bg,#f7f8fa);}

  /* ===================== Mobile / responsive layout ===================== */
  /* Hamburger toggle button - hidden on desktop, shown on mobile below.
     48x48 touch target per WCAG/Material guidance. */
  .hamburger-btn{display:none;width:48px;height:48px;min-width:48px;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;padding:0;margin-right:8px;border-radius:6px;}
  .hamburger-btn:hover{background:rgba(0,0,0,.06);}
  .hamburger-btn span,.hamburger-btn span::before,.hamburger-btn span::after{display:block;width:22px;height:2px;background:var(--text);position:relative;transition:transform .15s ease,opacity .15s ease;}
  .hamburger-btn span::before,.hamburger-btn span::after{content:'';position:absolute;left:0;}
  .hamburger-btn span::before{top:-7px;} .hamburger-btn span::after{top:7px;}

  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;}
  .sidebar-overlay.open{display:block;}

  /* Fluid, viewport-based sizing for the app shell so nothing forces a
     fixed pixel width; percentages/vw/vh + flex handle the rest. */
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  .login-box{width:min(340px,92vw);}

  @media (max-width:768px){
    /* Sidebar becomes an off-canvas drawer instead of a permanent column -
       avoids squeezing 230px of fixed-width nav into a ~360-430px phone
       screen, which is what causes page-level horizontal scrolling. */
    .hamburger-btn{display:flex;}
    .shell{position:relative;}
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; z-index:50;
      width:min(80vw,280px);
      transform:translateX(-100%);
      transition:transform .2s ease;
      box-shadow:2px 0 12px rgba(0,0,0,.25);
    }
    .sidebar.open{transform:translateX(0);}
    .main{width:100%;}
    .content{padding:14px;}
    .topbar{padding:10px 14px;}
    .topbar h2{font-size:15px;}
    .userinfo{gap:8px;font-size:11px;}
    .userinfo span:first-child{display:none;} /* hide name/role text on very small screens, keep logout reachable */

    /* Fluid grids: auto-fill already wraps responsively, just tighten the
       minimum column so 1-2 columns fit a phone instead of overflowing. */
    .cards{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
    .form-grid{grid-template-columns:1fr;gap:12px;}
    .access-grid{grid-template-columns:1fr;}

    /* Tables are the main horizontal-scroll risk on mobile. Rather than
       compressing every column illegibly, let each table scroll
       horizontally within itself (display:block + overflow-x:auto) so the
       PAGE never scrolls sideways, only the table does, with momentum
       scrolling on iOS. */
    table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;max-width:100%;}
    thead,tbody,tr{display:table;width:100%;table-layout:auto;}

    /* Touch targets: minimum 48x48px clickable area with spacing, per
       WCAG 2.5.5 / Material Design guidance, for every interactive
       control in the nav, toolbars and forms. */
    .nav-item{min-height:48px;display:flex;align-items:center;padding:12px 16px;}
    .nav-group h4{min-height:44px;display:flex;align-items:center;padding:10px 16px;}
    .btn{min-height:44px;padding:10px 18px;}
    .btn.small{min-height:38px;padding:8px 14px;}
    .tab{min-height:44px;display:flex;align-items:center;padding:10px 14px;}
    .logout-btn{min-height:40px;padding:8px 14px;}
    .card{padding:14px;min-height:64px;}
    .form-grid input,.form-grid select,.form-grid textarea{min-height:44px;padding:10px 12px;font-size:16px;} /* 16px prevents iOS auto-zoom on focus */
    .toolbar{flex-wrap:wrap;gap:8px;}
    .toolbar .btn{flex:0 0 auto;}
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>Venkateshwara Engineers</h1>
    <p>ERP System &mdash; Sign in to continue</p>
    <input id="login-username" placeholder="Username" autocomplete="username">
    <input id="login-password" type="password" placeholder="Password" autocomplete="current-password">
    <button onclick="doLogin()">Sign In</button>
    <div class="login-err" id="login-err"></div>
    <div class="hint">Demo logins (password shown after username):<br>
      admin / Admin@123 (full access)<br>
      hr1, accounts1, sales1, purchase1, pm1 / Demo@123</div>
  </div>
</div>

<div id="app">
  <div class="shell">
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebarDrawer()"></div>
    <div class="sidebar" id="sidebar"></div>
    <div class="main">
      <div class="topbar">
        <button class="hamburger-btn" id="hamburger-btn" onclick="toggleSidebarDrawer()" aria-label="Toggle navigation"><span></span></button>
        <h2 id="page-title" style="flex:1">Dashboard</h2>
        <div class="userinfo">
          <span><b id="user-name"></b> &middot; <span id="user-role"></span></span>
          <button class="logout-btn" onclick="doLogout()">Log out</button>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<script src="/js/app.js" defer></script>
</body>
</html>
